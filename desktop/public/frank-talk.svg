<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="frank talk">
  <!--
    PLACEHOLDER MARK.

    frank body has no approved logo asset for the "frank talk" sub-brand, and the
    brand guidelines are explicit that an approved asset always beats a
    recreation. The design handoff says as much: "App icon / favicon still need
    producing from the frank talk mark."

    This abstracts the in-app wordmark — the [frank][talk] capsule pair (outlined
    over filled) — into two stacked bars, because the real two-word wordmark is
    illegible at 16px. Pure vector shapes, no font dependency, so it renders
    without the licensed Pitch face installed.

    Replace this with the real asset when design supplies it, and regenerate
    src-tauri/icons/* from the same source.
  -->
  <rect width="32" height="32" rx="7" fill="#3F2A2D"/>
  <rect x="6" y="7" width="20" height="8" rx="2.5" fill="none" stroke="#FFFBFA" stroke-width="1.75"/>
  <rect x="6" y="18" width="20" height="8" rx="2.5" fill="#FFB6A5"/>
</svg>
