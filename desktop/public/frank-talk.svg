<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="frank talk">
  <!--
    Square reduction of the supplied frank talk wordmark, for the favicon and
    other tiny square slots.

    The wordmark itself is 4.36:1 — at 16px wide it would be under 4px tall and
    unreadable — so this keeps the logo's structure (one rounded block split into
    a dark field and a pale field) without its type.

    The ink is the lockup's own `#2A2A2A`. The pale field is brand blush
    (`#F8E6E6`) rather than the lockup's pure white on purpose: at 16px a white
    field disappears into light browser tab chrome and the mark loses its right
    half. One half-step down keeps the silhouette readable on light and dark
    chrome alike.

    This is an interim mark. A produced icon set (`src-tauri/icons/`, the
    `app-icon@2x/@3x.png` pair) still has to be cut from the official lockup.

    The full wordmark lives at public/frank-talk-wordmark.png and is what
    FrankWordmark renders wherever there is horizontal room.
  -->
  <rect width="32" height="32" rx="7" fill="#F8E6E6"/>
  <path d="M7 0h9v32H7A7 7 0 0 1 0 25V7a7 7 0 0 1 7-7z" fill="#2A2A2A"/>
  <rect x="4" y="14.5" width="8" height="3" rx="1.5" fill="#F8E6E6"/>
  <rect x="19" y="14.5" width="9" height="3" rx="1.5" fill="#2A2A2A"/>
</svg>
